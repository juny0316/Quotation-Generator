<title>유니포인트 견적서 생성기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 상단 바 + (견적 목록 | 작업 영역). 작업 영역은 6단계 스텝으로 진행. */
:root {
  --bg: #F1F3F7;
  --surface: #FFFFFF;
  --surface-2: #F7F8FB;
  --surface-3: #ECEFF5;
  --line: #DDE2EA;
  --line-2: #C6CEDA;
  --fg: #151B26;
  --fg-2: #4A5468;
  --fg-3: #7A8498;
  --brand: #1B47A0;
  --brand-2: #143B87;
  --brand-fg: #FFFFFF;
  --brand-soft: #E7EDFA;
  --dot: #EE7D1E;
  --ok: #157347; --ok-soft: #E1F2E8;
  --warn: #965800; --warn-soft: #FBEFD8;
  --bad: #B3261E; --bad-soft: #FBE5E3;
  --info: #39598E; --info-soft: #E7EDF7;
  --focus: #2F6BDB;
  --shadow-1: 0 1px 2px rgba(18, 28, 45, .06), 0 1px 1px rgba(18, 28, 45, .04);
  --shadow-2: 0 10px 28px rgba(18, 28, 45, .14), 0 2px 6px rgba(18, 28, 45, .08);
  --scrim: rgba(13, 19, 30, .38);
  --doc-paper: #FFFFFF; --doc-ink: #000000; --doc-head: #BDD7EE; --doc-sum: #FFF2CC; --doc-hl: #FFFF00;
  --f-ui: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --f-doc: "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", "Noto Sans KR", "IBM Plex Sans KR", sans-serif;
  --r-1: 6px; --r-2: 8px; --r-3: 12px;
  --top-h: 56px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1118; --surface: #151B25; --surface-2: #19202B; --surface-3: #212A38;
    --line: #283244; --line-2: #37445C; --fg: #E6EAF2; --fg-2: #A9B3C5; --fg-3: #7C879B;
    --brand: #8FB0F7; --brand-2: #AAC3FA; --brand-fg: #0B1222; --brand-soft: #1B2946; --dot: #F59A4A;
    --ok: #5DCB94; --ok-soft: #13301F; --warn: #E8B65C; --warn-soft: #33270F; --bad: #F28B82; --bad-soft: #3A1A18;
    --info: #9DB5E3; --info-soft: #1C2538; --focus: #8FB0F7;
    --shadow-1: 0 1px 2px rgba(0, 0, 0, .4); --shadow-2: 0 12px 30px rgba(0, 0, 0, .5);
    --scrim: rgba(0, 0, 0, .55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1118; --surface: #151B25; --surface-2: #19202B; --surface-3: #212A38;
  --line: #283244; --line-2: #37445C; --fg: #E6EAF2; --fg-2: #A9B3C5; --fg-3: #7C879B;
  --brand: #8FB0F7; --brand-2: #AAC3FA; --brand-fg: #0B1222; --brand-soft: #1B2946; --dot: #F59A4A;
  --ok: #5DCB94; --ok-soft: #13301F; --warn: #E8B65C; --warn-soft: #33270F; --bad: #F28B82; --bad-soft: #3A1A18;
  --info: #9DB5E3; --info-soft: #1C2538; --focus: #8FB0F7;
  --shadow-1: 0 1px 2px rgba(0, 0, 0, .4); --shadow-2: 0 12px 30px rgba(0, 0, 0, .5);
  --scrim: rgba(0, 0, 0, .55);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--f-ui); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4 { margin: 0; line-height: 1.3; text-wrap: balance; }
p { margin: 0; }
a { color: var(--brand); }
.num, .tnum { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--f-mono); font-size: .92em; letter-spacing: -.01em; }
.muted { color: var(--fg-2); }
.faint { color: var(--fg-3); }
.small { font-size: 12.5px; }
.xs { font-size: 11.5px; }
.nowrap { white-space: nowrap; }
.right { text-align: right; }
.center { text-align: center; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---------- 상단 바 ---------- */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; height: var(--top-h); display: flex; align-items: center; gap: 16px; background: var(--surface); border-bottom: 1px solid var(--line); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand img { height: 22px; width: auto; display: block; }
.brand .logo-plate { background: #fff; border-radius: 5px; padding: 3px 6px; display: flex; }
.brand b { font-size: 15px; font-weight: 600; white-space: nowrap; letter-spacing: -.01em; }
.nav { display: flex; gap: 2px; margin-left: 8px; }
.nav button { border: 0; background: transparent; padding: 7px 12px; border-radius: var(--r-1); color: var(--fg-2); font-weight: 500; cursor: pointer; white-space: nowrap; }
.nav button:hover { background: var(--surface-3); color: var(--fg); }
.nav button[aria-current="page"] { background: var(--brand-soft); color: var(--brand); }
.spacer { flex: 1; }
.savestate { display: flex; align-items: center; gap: 6px; color: var(--fg-3); font-size: 12.5px; white-space: nowrap; }
.savestate i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); display: inline-block; }
.savestate.busy i { background: var(--dot); }
.savestate.err i, .savestate.local i { background: var(--bad); }

/* ---------- 공통 요소 ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: var(--r-1); border: 1px solid var(--line-2); background: var(--surface); color: var(--fg); font-weight: 500; cursor: pointer; white-space: nowrap; transition: background .12s, border-color .12s; }
.btn:hover { background: var(--surface-3); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-fg); }
.btn.primary:hover { background: var(--brand-2); border-color: var(--brand-2); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--fg-2); }
.btn.ghost:hover { background: var(--surface-3); color: var(--fg); }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, var(--line-2)); }
.btn.danger.solid { background: var(--bad); color: #fff; border-color: var(--bad); }
.btn.sm { height: 28px; padding: 0 9px; font-size: 12.5px; }
.btn.lg { height: 42px; padding: 0 18px; font-size: 15px; }
.btn.icon { width: 30px; padding: 0; }
.btn .k { font-size: 11px; color: inherit; opacity: .75; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.row.tight { gap: 4px; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack.s8 { gap: 8px; }
.stack.s16 { gap: 16px; }
.stack.s20 { gap: 20px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 16px; }
.grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px 16px; }
@media (max-width: 760px) { .grid2, .grid3, .grid4 { grid-template-columns: minmax(0, 1fr); } }
.span2 { grid-column: span 2; }
@media (max-width: 760px) { .span2 { grid-column: auto; } }

.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > span { font-size: 12.5px; color: var(--fg-2); font-weight: 500; }
.field > span em { font-style: normal; color: var(--fg-3); font-weight: 400; margin-left: 4px; }
.input, .select, .textarea { width: 100%; min-width: 0; border: 1px solid var(--line-2); background: var(--surface); border-radius: var(--r-1); padding: 7px 10px; outline: none; transition: border-color .12s, box-shadow .12s; }
.input, .select { height: 36px; }
.textarea { resize: vertical; min-height: 72px; line-height: 1.55; }
.input:focus, .select:focus, .textarea:focus { border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 18%, transparent); }
.input::placeholder, .textarea::placeholder { color: var(--fg-3); }
.input.num { text-align: right; font-variant-numeric: tabular-nums; }
.check { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; user-select: none; }
.check input { width: 16px; height: 16px; accent-color: var(--brand); margin: 0; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-2); }
.panel-h { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.panel-h h3 { font-size: 15px; font-weight: 600; }
.panel-h .sub { color: var(--fg-3); font-size: 12.5px; }
.panel-b { padding: 16px; }
.panel-f { padding: 12px 16px; border-top: 1px solid var(--line); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; background: var(--surface-2); border-radius: 0 0 var(--r-2) var(--r-2); }

.chip { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 12px; font-weight: 500; white-space: nowrap; background: var(--surface-3); color: var(--fg-2); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.info { background: var(--info-soft); color: var(--info); }
.chip.brand { background: var(--brand-soft); color: var(--brand); }
.chip.outline { background: transparent; border: 1px solid var(--line-2); }

.note { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: var(--r-1); background: var(--surface-2); border: 1px solid var(--line); color: var(--fg-2); font-size: 13px; }
.note.warn { background: var(--warn-soft); border-color: transparent; color: var(--warn); }
.note.bad { background: var(--bad-soft); border-color: transparent; color: var(--bad); }
.note.info { background: var(--info-soft); border-color: transparent; color: var(--info); }
.note.ok { background: var(--ok-soft); border-color: transparent; color: var(--ok); }

.empty { text-align: center; padding: 40px 16px; color: var(--fg-2); display: flex; flex-direction: column; align-items: center; gap: 10px; }
.empty h3 { font-size: 16px; color: var(--fg); }

/* ---------- 표 ---------- */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-2); background: var(--surface); }
.tbl { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
.tbl th { position: sticky; top: 0; background: var(--surface-2); color: var(--fg-2); font-weight: 600; font-size: 12px; text-align: left; padding: 8px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; z-index: 1; }
.tbl td { padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl td.num, .tbl th.num { text-align: right; font-variant-numeric: tabular-nums; }
.tbl td .input, .tbl td .select, .tbl td .textarea { height: 32px; padding: 5px 8px; font-size: 13px; }
.tbl td .textarea { height: auto; min-height: 32px; }
.tbl tfoot td { background: var(--surface-2); font-weight: 600; border-top: 1px solid var(--line); border-bottom: 0; }
.tbl .idx { color: var(--fg-3); font-variant-numeric: tabular-nums; width: 32px; text-align: center; padding-top: 12px; }
.tbl tr.flag-bad td { background: color-mix(in srgb, var(--bad-soft) 55%, transparent); }
.tbl tr.flag-warn td { background: color-mix(in srgb, var(--warn-soft) 55%, transparent); }
.tbl tr.sub td { background: var(--surface-2); }
.cell-actions { display: flex; gap: 2px; justify-content: flex-end; }

/* ---------- 앱 레이아웃 ---------- */
.shell { min-height: calc(100% - var(--top-h)); }
.split { display: grid; grid-template-columns: 300px minmax(0, 1fr); min-height: calc(100vh - var(--top-h)); }
.plist { border-right: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; min-height: 0; position: sticky; top: calc(var(--top-h) + env(safe-area-inset-top, 0px)); height: calc(100vh - var(--top-h) - env(safe-area-inset-top, 0px)); }
.plist-h { padding: 14px 12px 10px max(12px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--line); }
.plist-items { overflow-y: auto; padding: 6px; flex: 1; }
.pitem { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 10px 10px; border-radius: var(--r-1); cursor: pointer; color: var(--fg); }
.pitem:hover { background: var(--surface-3); }
.pitem[aria-current="true"] { background: var(--brand-soft); }
.pitem .t { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pitem .m { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--fg-3); margin-top: 2px; }
.pitem .m span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pitem .top { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 3px; }
.work { min-width: 0; padding-block: 20px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.work-inner { max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.page { padding-block: 24px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.page-inner { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.page-title { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.page-title h2 { font-size: 22px; font-weight: 700; letter-spacing: -.02em; }
.back { display: none; }
@media (max-width: 960px) {
  .split { grid-template-columns: minmax(0, 1fr); }
  .plist { position: static; height: auto; border-right: 0; }
  .split.has-open .plist { display: none; }
  .split:not(.has-open) .work { display: none; }
  .back { display: inline-flex; }
  .brand b { display: none; }
}
@media (max-width: 560px) {
  .savestate span { display: none; }
  .nav button { padding: 7px 9px; }
}

/* 프로젝트 머리 */
.phead { display: flex; gap: 16px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
.phead .ttl { min-width: 0; flex: 1 1 360px; display: flex; flex-direction: column; gap: 6px; }
.ttl-input { font-size: 22px; font-weight: 700; letter-spacing: -.02em; border: 1px solid transparent; background: transparent; border-radius: var(--r-1); padding: 2px 6px; margin-left: -7px; width: 100%; min-width: 0; outline: none; }
.ttl-input:hover { border-color: var(--line); }
.ttl-input:focus { border-color: var(--focus); background: var(--surface); }
.phead .meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; color: var(--fg-2); font-size: 13px; }
.phead .tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

/* 스텝 */
.stepper { display: flex; gap: 0; overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-2); padding: 4px; scrollbar-width: thin; }
.step { flex: 1 0 auto; display: flex; align-items: center; gap: 9px; border: 0; background: transparent; padding: 9px 12px; border-radius: var(--r-1); cursor: pointer; color: var(--fg-2); text-align: left; min-width: 132px; position: relative; }
.step:hover { background: var(--surface-3); }
.step .n { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--line-2); display: grid; place-items: center; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; flex: none; background: var(--surface); }
.step .lb { display: flex; flex-direction: column; line-height: 1.25; }
.step .lb b { font-weight: 600; font-size: 13.5px; color: var(--fg); }
.step .lb small { font-size: 11.5px; color: var(--fg-3); }
.step.done .n { background: var(--brand-soft); border-color: transparent; color: var(--brand); }
.step[aria-current="step"] { background: var(--brand-soft); }
.step[aria-current="step"] .n { background: var(--brand); border-color: var(--brand); color: var(--brand-fg); position: relative; }
.step[aria-current="step"] .n::after { content: ""; position: absolute; top: -3px; right: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--dot); border: 2px solid var(--surface); }

/* 파일 놓기 */
.drop { border: 1.5px dashed var(--line-2); border-radius: var(--r-2); padding: 16px; display: flex; align-items: center; gap: 14px; background: var(--surface-2); cursor: pointer; transition: border-color .12s, background .12s; }
.drop:hover, .drop.over { border-color: var(--brand); background: var(--brand-soft); }
.drop .ic { width: 38px; height: 38px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); display: grid; place-items: center; flex: none; color: var(--brand); }
.drop b { font-weight: 600; }
.files { display: flex; gap: 6px; flex-wrap: wrap; }
.fchip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 6px 4px 10px; border: 1px solid var(--line); border-radius: var(--r-1); background: var(--surface); font-size: 12.5px; max-width: 100%; }
.fchip .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 240px; }
.fchip button { border: 0; background: transparent; cursor: pointer; color: var(--fg-3); width: 20px; height: 20px; border-radius: 4px; }
.fchip button:hover { background: var(--surface-3); color: var(--fg); }

/* AI 진행 */
.ai-run { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: var(--r-2); background: var(--brand-soft); color: var(--brand); }
.spin { width: 16px; height: 16px; border-radius: 50%; border: 2px solid color-mix(in srgb, currentColor 30%, transparent); border-top-color: currentColor; animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }

/* 검토 결과 */
.findings { display: flex; flex-direction: column; gap: 4px; margin: 0; padding: 0; list-style: none; }
.findings li { display: flex; gap: 8px; align-items: baseline; font-size: 13px; padding: 5px 8px; border-radius: 5px; }
.findings li .lv { flex: none; font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 4px; }
.findings li.bad .lv { background: var(--bad-soft); color: var(--bad); }
.findings li.warn .lv { background: var(--warn-soft); color: var(--warn); }
.findings li.info .lv { background: var(--info-soft); color: var(--info); }
.findings li.ok .lv { background: var(--ok-soft); color: var(--ok); }

/* KPI */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 760px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-2); padding: 12px 14px; min-width: 0; }
.kpi span { font-size: 12px; color: var(--fg-2); }
.kpi b { display: block; font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kpi small { color: var(--fg-3); font-size: 11.5px; }
.kpi.accent { border-color: color-mix(in srgb, var(--brand) 35%, var(--line)); }
.kpi.accent b { color: var(--brand); }

/* 합계 바 */
.totbar { display: flex; flex-wrap: wrap; gap: 8px 24px; padding: 12px 16px; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-2); align-items: baseline; }
.totbar div { display: flex; gap: 8px; align-items: baseline; }
.totbar span { color: var(--fg-2); font-size: 12.5px; }
.totbar b { font-variant-numeric: tabular-nums; font-size: 15px; }
.totbar .sep { width: 1px; height: 18px; background: var(--line-2); align-self: center; }

/* 메일 미리보기 */
.mailbox { border: 1px solid var(--line); border-radius: var(--r-2); overflow: hidden; }
.mailbox .hd { padding: 10px 12px; background: var(--surface-2); border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 4px 8px; font-size: 13px; }
.mailbox .hd span { color: var(--fg-3); }
.mailbox .hd b { font-weight: 500; overflow-wrap: anywhere; }
.mailbox .bd { padding: 14px; background: #fff; color: #111; max-height: 420px; overflow: auto; }

/* 문서 미리보기(견적서) */
.docwrap { background: var(--surface-3); border: 1px solid var(--line); border-radius: var(--r-2); padding: 16px; overflow: hidden; }
.docscale { transform-origin: 0 0; }
.qdoc { width: 1236px; background: var(--doc-paper); color: var(--doc-ink); font-family: var(--f-doc); padding: 18px 10px 28px; box-shadow: 0 2px 10px rgba(0, 0, 0, .12); }
.qd { border-collapse: collapse; table-layout: fixed; width: 1216px; color: var(--doc-ink); }
