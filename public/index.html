<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%226%22 fill=%22%231B47A0%22/%3E%3Ccircle cx=%2223%22 cy=%229%22 r=%224%22 fill=%22%23EE7D1E%22/%3E%3C/svg%3E">
<title>유니포인트 견적서 생성기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 상단 바 + (견적 목록 | 작업 영역). 작업 영역은 6단계 스텝으로 진행. */
:root {
  --bg: #F1F3F7;
  --surface: #FFFFFF;
  --surface-2: #F7F8FB;
  --surface-3: #ECEFF5;
  --line: #DDE2EA;
  --line-2: #C6CEDA;
  --fg: #151B26;
  --fg-2: #4A5468;
  --fg-3: #7A8498;
  --brand: #1B47A0;
  --brand-2: #143B87;
  --brand-fg: #FFFFFF;
  --brand-soft: #E7EDFA;
  --dot: #EE7D1E;
  --ok: #157347; --ok-soft: #E1F2E8;
  --warn: #965800; --warn-soft: #FBEFD8;
  --bad: #B3261E; --bad-soft: #FBE5E3;
  --info: #39598E; --info-soft: #E7EDF7;
  --focus: #2F6BDB;
  --shadow-1: 0 1px 2px rgba(18, 28, 45, .06), 0 1px 1px rgba(18, 28, 45, .04);
  --shadow-2: 0 10px 28px rgba(18, 28, 45, .14), 0 2px 6px rgba(18, 28, 45, .08);
  --scrim: rgba(13, 19, 30, .38);
  --doc-paper: #FFFFFF; --doc-ink: #000000; --doc-head: #BDD7EE; --doc-sum: #FFF2CC; --doc-hl: #FFFF00;
  --f-ui: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --f-doc: "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", "Noto Sans KR", "IBM Plex Sans KR", sans-serif;
  --r-1: 6px; --r-2: 8px; --r-3: 12px;
  --top-h: 56px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1118; --surface: #151B25; --surface-2: #19202B; --surface-3: #212A38;
    --line: #283244; --line-2: #37445C; --fg: #E6EAF2; --fg-2: #A9B3C5; --fg-3: #7C879B;
    --brand: #8FB0F7; --brand-2: #AAC3FA; --brand-fg: #0B1222; --brand-soft: #1B2946; --dot: #F59A4A;
    --ok: #5DCB94; --ok-soft: #13301F; --warn: #E8B65C; --warn-soft: #33270F; --bad: #F28B82; --bad-soft: #3A1A18;
    --info: #9DB5E3; --info-soft: #1C2538; --focus: #8FB0F7;
    --shadow-1: 0 1px 2px rgba(0, 0, 0, .4); --shadow-2: 0 12px 30px rgba(0, 0, 0, .5);
    --scrim: rgba(0, 0, 0, .55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1118; --surface: #151B25; --surface-2: #19202B; --surface-3: #212A38;
  --line: #283244; --line-2: #37445C; --fg: #E6EAF2; --fg-2: #A9B3C5; --fg-3: #7C879B;
  --brand: #8FB0F7; --brand-2: #AAC3FA; --brand-fg: #0B1222; --brand-soft: #1B2946; --dot: #F59A4A;
  --ok: #5DCB94; --ok-soft: #13301F; --warn: #E8B65C; --warn-soft: #33270F; --bad: #F28B82; --bad-soft: #3A1A18;
  --info: #9DB5E3; --info-soft: #1C2538; --focus: #8FB0F7;
  --shadow-1: 0 1px 2px rgba(0, 0, 0, .4); --shadow-2: 0 12px 30px rgba(0, 0, 0, .5);
  --scrim: rgba(0, 0, 0, .55);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--f-ui); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4 { margin: 0; line-height: 1.3; text-wrap: balance; }
p { margin: 0; }
a { color: var(--brand); }
.num, .tnum { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--f-mono); font-size: .92em; letter-spacing: -.01em; }
.muted { color: var(--fg-2); }
.faint { color: var(--fg-3); }
.small { font-size: 12.5px; }
.xs { font-size: 11.5px; }
.nowrap { white-space: nowrap; }
.right { text-align: right; }
.center { text-align: center; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---------- 상단 바 ---------- */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; height: var(--top-h); display: flex; align-items: center; gap: 16px; background: var(--surface); border-bottom: 1px solid var(--line); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand img { height: 22px; width: auto; display: block; }
.brand .logo-plate { background: #fff; border-radius: 5px; padding: 3px 6px; display: flex; }
.brand b { font-size: 15px; font-weight: 600; white-space: nowrap; letter-spacing: -.01em; }
.nav { display: flex; gap: 2px; margin-left: 8px; }
.nav button { border: 0; background: transparent; padding: 7px 12px; border-radius: var(--r-1); color: var(--fg-2); font-weight: 500; cursor: pointer; white-space: nowrap; }
.nav button:hover { background: var(--surface-3); color: var(--fg); }
.nav button[aria-current="page"] { background: var(--brand-soft); color: var(--brand); }
.spacer { flex: 1; }
.savestate { display: flex; align-items: center; gap: 6px; color: var(--fg-3); font-size: 12.5px; white-space: nowrap; }
.savestate i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); display: inline-block; }
.savestate.busy i { background: var(--dot); }
.savestate.err i, .savestate.local i { background: var(--bad); }

/* ---------- 공통 요소 ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: var(--r-1); border: 1px solid var(--line-2); background: var(--surface); color: var(--fg); font-weight: 500; cursor: pointer; white-space: nowrap; transition: background .12s, border-color .12s; }
.btn:hover { background: var(--surface-3); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-fg); }
.btn.primary:hover { background: var(--brand-2); border-color: var(--brand-2); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--fg-2); }
.btn.ghost:hover { background: var(--surface-3); color: var(--fg); }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, var(--line-2)); }
.btn.danger.solid { background: var(--bad); color: #fff; border-color: var(--bad); }
.btn.sm { height: 28px; padding: 0 9px; font-size: 12.5px; }
.btn.lg { height: 42px; padding: 0 18px; font-size: 15px; }
.btn.icon { width: 30px; padding: 0; }
.btn .k { font-size: 11px; color: inherit; opacity: .75; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.row.tight { gap: 4px; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack.s8 { gap: 8px; }
.stack.s16 { gap: 16px; }
.stack.s20 { gap: 20px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 16px; }
.grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px 16px; }
@media (max-width: 760px) { .grid2, .grid3, .grid4 { grid-template-columns: minmax(0, 1fr); } }
.span2 { grid-column: span 2; }
@media (max-width: 760px) { .span2 { grid-column: auto; } }

.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > span { font-size: 12.5px; color: var(--fg-2); font-weight: 500; }
.field > span em { font-style: normal; color: var(--fg-3); font-weight: 400; margin-left: 4px; }
.input, .select, .textarea { width: 100%; min-width: 0; border: 1px solid var(--line-2); background: var(--surface); border-radius: var(--r-1); padding: 7px 10px; outline: none; transition: border-color .12s, box-shadow .12s; }
.input, .select { height: 36px; }
.textarea { resize: vertical; min-height: 72px; line-height: 1.55; }
.input:focus, .select:focus, .textarea:focus { border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 18%, transparent); }
.input::placeholder, .textarea::placeholder { color: var(--fg-3); }
.input.num { text-align: right; font-variant-numeric: tabular-nums; }
.check { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; user-select: none; }
.check input { width: 16px; height: 16px; accent-color: var(--brand); margin: 0; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-2); }
.panel-h { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.panel-h h3 { font-size: 15px; font-weight: 600; }
.panel-h .sub { color: var(--fg-3); font-size: 12.5px; }
.panel-b { padding: 16px; }
.panel-f { padding: 12px 16px; border-top: 1px solid var(--line); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; background: var(--surface-2); border-radius: 0 0 var(--r-2) var(--r-2); }

.chip { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 12px; font-weight: 500; white-space: nowrap; background: var(--surface-3); color: var(--fg-2); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.info { background: var(--info-soft); color: var(--info); }
.chip.brand { background: var(--brand-soft); color: var(--brand); }
.chip.outline { background: transparent; border: 1px solid var(--line-2); }

.note { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: var(--r-1); background: var(--surface-2); border: 1px solid var(--line); color: var(--fg-2); font-size: 13px; }
.note.warn { background: var(--warn-soft); border-color: transparent; color: var(--warn); }
.note.bad { background: var(--bad-soft); border-color: transparent; color: var(--bad); }
.note.info { background: var(--info-soft); border-color: transparent; color: var(--info); }
.note.ok { background: var(--ok-soft); border-color: transparent; color: var(--ok); }

.empty { text-align: center; padding: 40px 16px; color: var(--fg-2); display: flex; flex-direction: column; align-items: center; gap: 10px; }
.empty h3 { font-size: 16px; color: var(--fg); }

/* ---------- 표 ---------- */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-2); background: var(--surface); }
.tbl { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
.tbl th { position: sticky; top: 0; background: var(--surface-2); color: var(--fg-2); font-weight: 600; font-size: 12px; text-align: left; padding: 8px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; z-index: 1; }
.tbl td { padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl td.num, .tbl th.num { text-align: right; font-variant-numeric: tabular-nums; }
.tbl td .input, .tbl td .select, .tbl td .textarea { height: 32px; padding: 5px 8px; font-size: 13px; }
.tbl td .textarea { height: auto; min-height: 32px; }
.tbl tfoot td { background: var(--surface-2); font-weight: 600; border-top: 1px solid var(--line); border-bottom: 0; }
.tbl .idx { color: var(--fg-3); font-variant-numeric: tabular-nums; width: 32px; text-align: center; padding-top: 12px; }
.tbl tr.flag-bad td { background: color-mix(in srgb, var(--bad-soft) 55%, transparent); }
.tbl tr.flag-warn td { background: color-mix(in srgb, var(--warn-soft) 55%, transparent); }
.tbl tr.sub td { background: var(--surface-2); }
.cell-actions { display: flex; gap: 2px; justify-content: flex-end; }

/* ---------- 앱 레이아웃 ---------- */
.shell { min-height: calc(100% - var(--top-h)); }
.split { display: grid; grid-template-columns: 300px minmax(0, 1fr); min-height: calc(100vh - var(--top-h)); }
.plist { border-right: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; min-height: 0; position: sticky; top: calc(var(--top-h) + env(safe-area-inset-top, 0px)); height: calc(100vh - var(--top-h) - env(safe-area-inset-top, 0px)); }
.plist-h { padding: 14px 12px 10px max(12px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--line); }
.plist-items { overflow-y: auto; padding: 6px; flex: 1; }
.pitem { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 10px 10px; border-radius: var(--r-1); cursor: pointer; color: var(--fg); }
.pitem:hover { background: var(--surface-3); }
.pitem[aria-current="true"] { background: var(--brand-soft); }
.pitem .t { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pitem .m { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--fg-3); margin-top: 2px; }
.pitem .m span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pitem .top { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 3px; }
.work { min-width: 0; padding-block: 20px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.work-inner { max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.page { padding-block: 24px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.page-inner { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.page-title { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.page-title h2 { font-size: 22px; font-weight: 700; letter-spacing: -.02em; }
.back { display: none; }
@media (max-width: 960px) {
  .split { grid-template-columns: minmax(0, 1fr); }
  .plist { position: static; height: auto; border-right: 0; }
  .split.has-open .plist { display: none; }
  .split:not(.has-open) .work { display: none; }
  .back { display: inline-flex; }
  .brand b { display: none; }
}
@media (max-width: 560px) {
  .savestate span { display: none; }
  .nav button { padding: 7px 9px; }
}

/* 프로젝트 머리 */
.phead { display: flex; gap: 16px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
.phead .ttl { min-width: 0; flex: 1 1 360px; display: flex; flex-direction: column; gap: 6px; }
.ttl-input { font-size: 22px; font-weight: 700; letter-spacing: -.02em; border: 1px solid transparent; background: transparent; border-radius: var(--r-1); padding: 2px 6px; margin-left: -7px; width: 100%; min-width: 0; outline: none; }
.ttl-input:hover { border-color: var(--line); }
.ttl-input:focus { border-color: var(--focus); background: var(--surface); }
.phead .meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; color: var(--fg-2); font-size: 13px; }
.phead .tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

/* 스텝 */
.stepper { display: flex; gap: 0; overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-2); padding: 4px; scrollbar-width: thin; }
.step { flex: 1 0 auto; display: flex; align-items: center; gap: 9px; border: 0; background: transparent; padding: 9px 12px; border-radius: var(--r-1); cursor: pointer; color: var(--fg-2); text-align: left; min-width: 132px; position: relative; }
.step:hover { background: var(--surface-3); }
.step .n { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--line-2); display: grid; place-items: center; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; flex: none; background: var(--surface); }
.step .lb { display: flex; flex-direction: column; line-height: 1.25; }
.step .lb b { font-weight: 600; font-size: 13.5px; color: var(--fg); }
.step .lb small { font-size: 11.5px; color: var(--fg-3); }
.step.done .n { background: var(--brand-soft); border-color: transparent; color: var(--brand); }
.step[aria-current="step"] { background: var(--brand-soft); }
.step[aria-current="step"] .n { background: var(--brand); border-color: var(--brand); color: var(--brand-fg); position: relative; }
.step[aria-current="step"] .n::after { content: ""; position: absolute; top: -3px; right: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--dot); border: 2px solid var(--surface); }

/* 파일 놓기 */
.drop { border: 1.5px dashed var(--line-2); border-radius: var(--r-2); padding: 16px; display: flex; align-items: center; gap: 14px; background: var(--surface-2); cursor: pointer; transition: border-color .12s, background .12s; }
.drop:hover, .drop.over { border-color: var(--brand); background: var(--brand-soft); }
.drop .ic { width: 38px; height: 38px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); display: grid; place-items: center; flex: none; color: var(--brand); }
.drop b { font-weight: 600; }
.files { display: flex; gap: 6px; flex-wrap: wrap; }
.fchip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 6px 4px 10px; border: 1px solid var(--line); border-radius: var(--r-1); background: var(--surface); font-size: 12.5px; max-width: 100%; }
.fchip .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 240px; }
.fchip button { border: 0; background: transparent; cursor: pointer; color: var(--fg-3); width: 20px; height: 20px; border-radius: 4px; }
.fchip button:hover { background: var(--surface-3); color: var(--fg); }
.fchip .nm.link { cursor: pointer; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 2px; }
.fchip.on { border-color: var(--brand); background: var(--brand-soft); }

/* 첨부 미리보기 */
.fpreview { border: 1px solid var(--line); border-radius: var(--r-2); background: var(--surface-2, var(--surface)); }
.fpreview-h { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
.fpreview-b { max-height: 420px; overflow: auto; padding: 10px 12px; }
.fpreview pre { margin: 0; white-space: pre-wrap; word-break: break-word; font: 12.5px/1.55 ui-monospace, Consolas, monospace; }
.fpreview .tbl.sheet { width: auto; min-width: 100%; font-size: 12px; }
.fpreview .tbl.sheet td { padding: 4px 8px; white-space: pre-wrap; vertical-align: top; max-width: 360px; border: 1px solid var(--line); }
.fpreview img { display: block; max-width: 100%; height: auto; margin: 0 auto 10px; border: 1px solid var(--line); }
.spin { width: 16px; height: 16px; border-radius: 50%; border: 2px solid color-mix(in srgb, currentColor 30%, transparent); border-top-color: currentColor; animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }

/* 검토 결과 */
.findings { display: flex; flex-direction: column; gap: 4px; margin: 0; padding: 0; list-style: none; }
.findings li { display: flex; gap: 8px; align-items: baseline; font-size: 13px; padding: 5px 8px; border-radius: 5px; }
.findings li .lv { flex: none; font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 4px; }
.findings li.bad .lv { background: var(--bad-soft); color: var(--bad); }
.findings li.warn .lv { background: var(--warn-soft); color: var(--warn); }
.findings li.info .lv { background: var(--info-soft); color: var(--info); }
.findings li.ok .lv { background: var(--ok-soft); color: var(--ok); }

/* KPI */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 760px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-2); padding: 12px 14px; min-width: 0; }
.kpi span { font-size: 12px; color: var(--fg-2); }
.kpi b { display: block; font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kpi small { color: var(--fg-3); font-size: 11.5px; }
.kpi.accent { border-color: color-mix(in srgb, var(--brand) 35%, var(--line)); }
.kpi.accent b { color: var(--brand); }

/* 합계 바 */
.totbar { display: flex; flex-wrap: wrap; gap: 8px 24px; padding: 12px 16px; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-2); align-items: baseline; }
.totbar div { display: flex; gap: 8px; align-items: baseline; }
.totbar span { color: var(--fg-2); font-size: 12.5px; }
.totbar b { font-variant-numeric: tabular-nums; font-size: 15px; }
.totbar .sep { width: 1px; height: 18px; background: var(--line-2); align-self: center; }

/* 메일 미리보기 */
.mailbox { border: 1px solid var(--line); border-radius: var(--r-2); overflow: hidden; }
.mailbox .hd { padding: 10px 12px; background: var(--surface-2); border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 4px 8px; font-size: 13px; }
.mailbox .hd span { color: var(--fg-3); }
.mailbox .hd b { font-weight: 500; overflow-wrap: anywhere; }
.mailbox .bd { padding: 14px; background: #fff; color: #111; max-height: 420px; overflow: auto; }

/* 문서 미리보기(견적서) */
.docwrap { background: var(--surface-3); border: 1px solid var(--line); border-radius: var(--r-2); padding: 16px; overflow: hidden; }
.docscale { transform-origin: 0 0; }
.qdoc { width: 1236px; background: var(--doc-paper); color: var(--doc-ink); font-family: var(--f-doc); padding: 18px 10px 28px; box-shadow: 0 2px 10px rgba(0, 0, 0, .12); }
.qd { border-collapse: collapse; table-layout: fixed; width: 1216px; color: var(--doc-ink); }
.qd td { padding: 0 3px; font-size: 14.7px; line-height: 1.25; height: 23px; vertical-align: middle; white-space: nowrap; overflow: hidden; }
.qd td.pre { white-space: pre; }
.qd .fl { border-left: 2px solid var(--doc-ink); }
.qd .fr { border-right: 2px solid var(--doc-ink); }
.qd .contact { font-weight: 700; text-align: center; height: 33px; border-top: 2px solid var(--doc-ink); border-bottom: 3px double var(--doc-ink); }
.qd .title { height: 65px; font-size: 37px; font-weight: 700; text-align: center; position: relative; letter-spacing: 0; }
.qd .title img { position: absolute; left: 28px; top: 14px; width: 132px; height: auto; }
.qd .lbl { font-size: 18.7px; font-weight: 700; height: 28px; }
.qd .co { font-size: 18.7px; font-weight: 700; }
.qd .co.big { font-size: 26.7px; height: 40px; }
.qd .unit { font-size: 16px; font-weight: 700; text-align: right; }
.qd .hd td { background: var(--doc-head); font-weight: 700; font-size: 17.3px; text-align: center; border: 1px solid var(--doc-ink); height: 27px; }
.qd .it td { border-left: 1px solid var(--doc-ink); border-right: 1px solid var(--doc-ink); }
.qd .it td.c { text-align: center; }
.qd .it td.wrap { white-space: normal; }
.qd .it.first td { border-top: 1px solid var(--doc-ink); }
.qd .it.last td { border-bottom: 1px solid var(--doc-ink); }
.qd .it td.m { border-top: 1px solid var(--doc-ink); border-bottom: 1px solid var(--doc-ink); }
.qd .it td.ar { font-family: Arial, var(--f-doc); }
.qd .it td.amt { text-align: right; padding-right: 10px; }
.qd .sum td { background: var(--doc-sum); font-weight: 700; font-size: 17.3px; height: 27px; border-top: 1px solid var(--doc-ink); border-bottom: 1px solid var(--doc-ink); }
.qd .sum td.v { text-align: right; padding-right: 6px; border-left: 1px solid var(--doc-ink); border-right: 1px solid var(--doc-ink); }
.qd .tx td { font-weight: 700; height: 27px; }
.qd .tx td.hl { background: var(--doc-hl); text-align: center; }
.qd .tx.big td { font-size: 16px; }
.qd .end td { border-bottom: 2px solid var(--doc-ink); height: 24px; }

/* 토스트 */
.toasts { position: fixed; z-index: 60; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; width: min(92vw, 520px); }
.toast { pointer-events: auto; background: var(--fg); color: var(--bg); padding: 10px 14px; border-radius: var(--r-2); box-shadow: var(--shadow-2); font-size: 13.5px; display: flex; gap: 10px; align-items: center; }
.toast.bad { background: var(--bad); color: #fff; }

/* 모달 */
.scrim { position: fixed; inset: 0; z-index: 50; background: var(--scrim); display: grid; place-items: center; padding: 16px; }
.modal { background: var(--surface); border-radius: var(--r-3); box-shadow: var(--shadow-2); width: min(560px, 100%); max-height: calc(100vh - 32px); overflow: auto; }
.modal .panel-h { border-bottom: 1px solid var(--line); }

/* 비교표 */
.cmp td.pick { cursor: pointer; }
.cmp td.pick:hover { background: var(--surface-3); }
.cmp td.on { background: var(--brand-soft); }
.cmp .price { font-weight: 600; font-variant-numeric: tabular-nums; }
.badge-low { font-size: 10.5px; font-weight: 600; color: var(--ok); background: var(--ok-soft); padding: 0 5px; border-radius: 3px; margin-left: 4px; }

/* 매출 라인 */
.line-sub { display: flex; flex-direction: column; gap: 6px; padding: 4px 0 6px; }
.spec-row { display: grid; grid-template-columns: 110px minmax(0, 1fr) 110px 30px; gap: 6px; }
@media (max-width: 600px) { .spec-row { grid-template-columns: 80px minmax(0, 1fr) 70px 30px; } }
.srcnote { font-size: 11.5px; color: var(--fg-3); margin-top: 3px; display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.gp-low { color: var(--bad); font-weight: 600; }

.section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.section-title h3 { font-size: 16px; font-weight: 600; }
.hint { color: var(--fg-3); font-size: 12.5px; }
.divider { height: 1px; background: var(--line); margin: 4px 0; }
.kv { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 6px 10px; font-size: 13px; }
.kv span { color: var(--fg-3); }
.qcard .panel-h { cursor: default; }
details > summary { cursor: pointer; list-style: none; }
details > summary::-webkit-details-marker { display: none; }
.disc { display: inline-flex; align-items: center; gap: 6px; color: var(--fg-2); font-size: 13px; font-weight: 500; }
.disc::before { content: "▸"; font-size: 11px; transition: transform .15s; }
details[open] > summary .disc::before, details[open] > summary.disc::before { transform: rotate(90deg); }
.skeleton { height: 14px; border-radius: 4px; background: linear-gradient(90deg, var(--surface-3), var(--surface-2), var(--surface-3)); background-size: 200% 100%; animation: sk 1.2s infinite; }
@keyframes sk { to { background-position: -200% 0; } }
</style>

/* ===== 순수 계산·서식 로직 (브라우저/Node 공용) ===== */
(function (root) {
  'use strict';
  const L = {};

  /* ---------- id ---------- */
  L.uid = (p) => (p || '') + Math.random().toString(36).slice(2, 7) + (Date.now() % 1679616).toString(36);

  /* ---------- 숫자 ---------- */
  L.num = function (v) {
    if (v === null || v === undefined || v === '') return null;
    if (typeof v === 'number') return isFinite(v) ? v : null;
    let s = String(v).trim();
    if (!s) return null;
    const neg = /^\(.*\)$/.test(s) || /^-/.test(s.replace(/[₩\s]/g, ''));
    s = s.replace(/[^\d.]/g, '');
    if (!s || s === '.') return null;
    const n = Number(s);
    if (!isFinite(n)) return null;
    return neg ? -n : n;
  };
  L.fmt = (n) => (n === null || n === undefined || !isFinite(n)) ? '' : Math.round(n).toLocaleString('en-US');
  L.pct = (r, d) => (r === null || r === undefined || !isFinite(r)) ? '–' : (r * 100).toFixed(d === undefined ? 1 : d) + '%';

  L.roundUnit = function (v, unit, mode) {
    if (v === null || v === undefined || !isFinite(v)) return null;
    unit = unit > 0 ? unit : 1;
    const q = v / unit;
    let r;
    if (mode === 'floor') r = Math.floor(q + 1e-9);
    else if (mode === 'round') r = Math.round(q);
    else r = Math.ceil(q - 1e-9);
    return r * unit;
  };

  /* GP율(매출 대비) 기준 제안가: 매입가 ÷ (1 − GP%) → 단위 올림 */
  L.priceFromGp = function (cost, gpRate, unit) {
    cost = L.num(cost); gpRate = L.num(gpRate);
    if (cost === null || gpRate === null || gpRate >= 100) return null;
    return L.roundUnit(cost / (1 - gpRate / 100), unit || 1, 'ceil');
  };
  /* 실제 GP율(0~1) */
  L.gpRateOf = function (price, cost) {
    price = L.num(price); cost = L.num(cost);
    if (price === null || cost === null || !price) return null;
    return (price - cost) / price;
  };
  /* 부가세: 공급가액 × 10%, 원 미만 절사 */
  L.vat = (supply) => {
    const s = L.num(supply) || 0;
    return Math.trunc(s * 0.1 + (s >= 0 ? 1e-7 : -1e-7));
  };

  /* 한글 금액 (일금 ○○원정) */
  L.koreanAmount = function (n) {
    n = Math.round(Math.abs(L.num(n) || 0));
    if (n === 0) return '영';
    const D = ['', '일', '이', '삼', '사', '오', '육', '칠', '팔', '구'];
    const S = ['', '십', '백', '천'];
    const B = ['', '만', '억', '조', '경'];
    let out = '';
    let i = 0;
    while (n > 0) {
      const chunk = n % 10000;
      n = Math.floor(n / 10000);
      if (chunk) {
        let cs = '';
        let c = chunk, j = 0;
        while (c > 0) {
          const d = c % 10;
          if (d) cs = D[d] + S[j] + cs;
          c = Math.floor(c / 10); j++;
        }
        out = cs + B[i] + out;
      }
      i++;
    }
    return out;
  };

  /* ---------- 날짜 ---------- */
  L.ymd = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  L.today = () => L.ymd(new Date());
  L.parseYmd = function (s) {
    if (!s) return null;
    if (s instanceof Date) return isNaN(s) ? null : new Date(s.getFullYear(), s.getMonth(), s.getDate());
    const str = String(s).trim();
    let m = /(\d{4})\s*[-./년]\s*(\d{1,2})\s*[-./월]\s*(\d{1,2})/.exec(str);
    if (m) {
      const d = new Date(+m[1], +m[2] - 1, +m[3]);
      return isNaN(d) ? null : d;
    }
    return null;
  };
  L.addDays = function (s, n) {
    const d = L.parseYmd(s) || new Date();
    d.setDate(d.getDate() + n);
    return L.ymd(d);
  };
  L.addBizDays = function (s, n) {
    const d = L.parseYmd(s) || new Date();
    let k = 0;
    while (k < n) {
      d.setDate(d.getDate() + 1);
      const w = d.getDay();
      if (w !== 0 && w !== 6) k++;
    }
    return L.ymd(d);
  };
  L.fmtDateK = function (s) {
    const d = L.parseYmd(s);
    if (!d) return s || '';
    return L.ymd(d) + '(' + '일월화수목금토'[d.getDay()] + ')';
  };
  L.fmtDateLong = function (s) {
    const d = L.parseYmd(s);
    if (!d) return s || '';
    return d.getFullYear() + '년 ' + String(d.getMonth() + 1).padStart(2, '0') + '월 ' + String(d.getDate()).padStart(2, '0') + '일';
  };
  /* "2026-03-12", "견적일로부터 1주", "30일" → 만료일 */
  L.resolveValidity = function (baseDate, text) {
    if (!text) return null;
    const direct = L.parseYmd(text);
    if (direct) return direct;
    const base = L.parseYmd(baseDate);
    if (!base) return null;
    const m = /(\d+)\s*(일|주|개월|달|日|day|week|month)/i.exec(String(text));
    if (!m) return null;
    const n = +m[1];
    const u = m[2];
    const d = new Date(base);
    if (/주|week/i.test(u)) d.setDate(d.getDate() + n * 7);
    else if (/개월|달|month/i.test(u)) d.setMonth(d.getMonth() + n);
    else d.setDate(d.getDate() + n);
    return d;
  };

  /* ---------- 견적번호 ---------- */
  L.nextQuoteNo = function (prefix, ymd, existing) {
    const base = (prefix || 'Q') + '-' + String(ymd || L.today()).replace(/-/g, '').slice(2);
    let max = 0;
    (existing || []).forEach((no) => {
      if (no && String(no).indexOf(base + '-') === 0) {
        const k = parseInt(String(no).slice(base.length + 1), 10);
        if (k > max) max = k;
      }
    });
    return base + '-' + String(max + 1).padStart(2, '0');
  };

  /* ---------- 매입 견적 ---------- */
  /* 매입 단가(공급가, 부가세 별도) */
  L.supplyUnit = function (quote, qi) {
    if (!qi) return null;
    let u = L.num(qi.unitPrice);
    if (u === null) {
      const a = L.num(qi.amount), q = L.num(qi.qty);
      if (a !== null && q) u = a / q;
    }
    if (u === null) return null;
    return quote && quote.vat === 'included' ? Math.round(u / 1.1) : u;
  };
  L.quoteItemAmount = function (qi) {
    const a = L.num(qi.amount);
    if (a !== null) return a;
    const u = L.num(qi.unitPrice), q = L.num(qi.qty);
    return u !== null && q !== null ? u * q : null;
  };

  L.reviewQuote = function (project, quote, todayStr) {
    const F = [];
    const items = project.items || [];
    const qItems = quote.items || [];
    const add = (level, text, ref) => F.push({ level: level, text: text, ref: ref || null });
    const f = L.fmt;

    items.forEach((it, i) => {
      const label = (i + 1) + '. ' + (it.name || '품목');
      const ms = qItems.filter((q) => q.reqItemId === it.id);
      if (!ms.length) { add('bad', label + ' — 견적에 없음', it.id); return; }
      ms.forEach((q) => {
        const rq = L.num(it.qty), qq = L.num(q.qty);
        if (rq !== null && qq !== null && rq !== qq) add('warn', label + ' — 수량 다름 (요청 ' + rq + ' / 견적 ' + qq + ')', it.id);
        if (q.match === 'alternative') add('warn', label + ' — 대체품 제안' + (q.matchNote ? ': ' + q.matchNote : ''), it.id);
        else if (q.match === 'partial') add('warn', label + ' — 사양 일부 다름' + (q.matchNote ? ': ' + q.matchNote : ''), it.id);
        else if (q.match === 'exact') add('ok', label + ' — 요청 사양과 일치', it.id);
      });
    });

    qItems.forEach((q) => {
      const nm = q.model || q.name || '품목';
      const u = L.num(q.unitPrice), qty = L.num(q.qty), amt = L.num(q.amount);
      if (u === null && amt === null) add('bad', nm + ' — 단가 없음');
      if (u !== null && qty !== null && amt !== null) {
        const calc = u * qty;
        if (Math.abs(calc - amt) > Math.max(1, Math.abs(amt) * 0.0005)) {
          add('bad', nm + ' — 금액 계산 불일치 (' + f(u) + ' × ' + qty + ' = ' + f(calc) + ', 견적서 ' + f(amt) + ')');
        }
      }
      if (!q.reqItemId && items.length) add('info', '요청 외 항목: ' + nm + (amt !== null ? ' ' + f(amt) + '원' : ''));
    });

    const sumAmt = qItems.reduce((s, q) => s + (L.quoteItemAmount(q) || 0), 0);
    const t = quote.totals || {};
    const supply = L.num(t.supply), vat = L.num(t.vat), total = L.num(t.total);
    if (quote.vat === 'included') add('info', '부가세 포함 단가 — 공급가(÷1.1)로 환산해 사용');
    else if (quote.vat !== 'excluded') add('warn', '부가세 포함 여부가 불분명 — 확인 필요');
    if (supply !== null && Math.abs(supply - sumAmt) > 10) add('warn', '합계 불일치 — 품목 합 ' + f(sumAmt) + ' / 견적서 공급가 ' + f(supply));
    if (supply !== null && vat !== null && quote.vat !== 'included' && Math.abs(L.vat(supply) - vat) > 10) add('warn', '부가세 확인 — 공급가의 10% ' + f(L.vat(supply)) + ' / 견적서 ' + f(vat));
    if (supply !== null && vat !== null && total !== null && Math.abs(supply + vat - total) > 10) add('warn', '총액 확인 — ' + f(supply) + ' + ' + f(vat) + ' ≠ ' + f(total));

    const terms = quote.terms || {};
    const vd = L.resolveValidity(quote.quoteDate, terms.validUntil);
    if (vd) {
      const today = L.parseYmd(todayStr || L.today());
      const diff = Math.round((vd - today) / 86400000);
      if (diff < 0) add('bad', '견적 유효기간 만료 (' + L.ymd(vd) + ')');
      else if (diff <= 3) add('warn', '견적 유효기간 임박 (' + L.ymd(vd) + ', ' + diff + '일 남음)');
      else add('ok', '유효기간 ' + L.ymd(vd) + '까지');
    } else if (!terms.validUntil) add('warn', '견적 유효기간 기재 없음');

    const counts = { bad: 0, warn: 0, info: 0, ok: 0 };
    F.forEach((x) => { counts[x.level] = (counts[x.level] || 0) + 1; });
    return { findings: F, counts: counts, sumAmt: sumAmt, validUntil: vd ? L.ymd(vd) : null };
  };

  /* 요청 품목별 채택(매입처·품목) — 명시 선택 우선, 없으면 최저가 */
  L.effectiveAdopt = function (project) {
    const out = {};
    const quotes = project.quotes || [];
    const explicit = project.adopt || {};
    (project.items || []).forEach((it) => {
      const ex = explicit[it.id];
      if (ex === 'none') { out[it.id] = null; return; }
      if (ex && ex.quoteId) {
        const qt = quotes.find((q) => q.id === ex.quoteId);
        const qi = qt && (qt.items || []).find((x) => x.id === ex.quoteItemId);
        if (qi) { out[it.id] = { quoteId: qt.id, quoteItemId: qi.id }; return; }
      }
      let best = null;
      quotes.forEach((qt) => (qt.items || []).forEach((qi) => {
        if (qi.reqItemId !== it.id) return;
        const u = L.supplyUnit(qt, qi);
        if (u === null) return;
        if (!best || u < best.u) best = { quoteId: qt.id, quoteItemId: qi.id, u: u };
      }));
      out[it.id] = best ? { quoteId: best.quoteId, quoteItemId: best.quoteItemId } : null;
    });
    return out;
  };

  L.findQuoteItem = function (project, ref) {
    if (!ref || !ref.quoteId) return null;
    const qt = (project.quotes || []).find((q) => q.id === ref.quoteId);
    const qi = qt && (qt.items || []).find((x) => x.id === ref.quoteItemId);
    return qi ? { qt: qt, qi: qi } : null;
  };

  /* ---------- 매출 견적 ---------- */
  L.makeLineFromQuote = function (project, it, qt, qi, defaults) {
    const gp = L.num(defaults.gpRate) ?? 10;
    const unit = L.num(defaults.priceRound) || 1;
    const costUnit = qi ? L.supplyUnit(qt, qi) : null;
    const qty = L.num(it && it.qty) ?? L.num(qi && qi.qty) ?? 1;
    return {
      id: L.uid('l'),
      category: (it && it.name) || (qi && qi.name) || '',
      name: (qi && (qi.model || qi.name)) || (it && (it.model || it.name)) || '',
      specs: ((qi && qi.specs) || []).map((s) => ({ cat: s.cat || '', detail: s.detail || '', spec: s.spec || '' })),
      qty: qty,
      unit: (it && it.unit) || (qi && qi.unit) || 'EA',
      costUnit: costUnit,
      gpRate: gp,
      unitPrice: costUnit !== null ? L.priceFromGp(costUnit, gp, unit) : null,
      note: '',
      src: qi ? { quoteId: qt.id, quoteItemId: qi.id, reqItemId: it ? it.id : null } : { reqItemId: it ? it.id : null },
      vendorName: qt ? (qt.vendorName || '') : '',
      costLabel: qi ? [qi.model, qi.name].filter(Boolean).filter((v, i, a) => a.indexOf(v) === i).join(' / ') : ''
    };
  };

  /* 요청 품목 없이 매입 견적부터 시작한 경우: 견적서 품목을 그대로 매출 견적 줄로 쓴다 */
  L.quoteOnly = function (project) { return !(project.items || []).length && (project.quotes || []).length > 0; };
  L.baseQuote = function (project, quoteId) {
    const quotes = project.quotes || [];
    return quotes.find((q) => q.id === quoteId) || quotes[0] || null;
  };

  L.buildSalesLines = function (project, defaults, quoteId) {
    if (L.quoteOnly(project)) {
      const qt = L.baseQuote(project, quoteId);
      return (qt.items || []).map((qi) => L.makeLineFromQuote(project, null, qt, qi, defaults));
    }
    const adopt = L.effectiveAdopt(project);
    return (project.items || []).map((it) => {
      const hit = L.findQuoteItem(project, adopt[it.id]);
      return L.makeLineFromQuote(project, it, hit && hit.qt, hit && hit.qi, defaults);
    });
  };

  /* 채택된 견적의 '요청 외 항목'(배송비·설치비 등) */
  L.extraQuoteItems = function (project) {
    const adopt = L.effectiveAdopt(project);
    const used = new Set(Object.values(adopt).filter(Boolean).map((a) => a.quoteId));
    const out = [];
    (project.quotes || []).forEach((qt) => {
      if (!used.has(qt.id)) return;
      (qt.items || []).forEach((qi) => { if (!qi.reqItemId) out.push({ qt: qt, qi: qi }); });
    });
    return out;
  };

  /* 견적 주석 후보(변경 사항) — 채택된 견적 품목 기준 */
  L.collectDeviations = function (project) {
    const out = [];
    const seen = new Set();
    if (L.quoteOnly(project)) {
      const used = new Set((((project.sales && project.sales.lines) || [])).map((ln) => ln.src && ln.src.quoteId).filter(Boolean));
      (project.quotes || []).forEach((qt) => {
        if (used.size && !used.has(qt.id)) return;
        (qt.deviations || []).forEach((d) => {
          const key = (d.title || '') + '|' + (d.reason || '');
          if (!d.title || seen.has(key)) return;
          seen.add(key);
          out.push({ id: L.uid('n'), title: d.title || '', reason: d.reason || '' });
        });
      });
      return out;
    }
    const adopt = L.effectiveAdopt(project);
    Object.keys(adopt).forEach((reqId) => {
      const a = adopt[reqId];
      if (!a) return;
      const qt = (project.quotes || []).find((q) => q.id === a.quoteId);
      if (!qt) return;
      (qt.deviations || []).forEach((d) => {
        if (d.reqItemId && d.reqItemId !== reqId) return;
        const key = (d.title || '') + '|' + (d.reason || '');
        if (seen.has(key)) return;
        seen.add(key);
        out.push({ id: L.uid('n'), title: d.title || '', reason: d.reason || '' });
      });
    });
    return out;
  };

  L.lineCalc = function (ln) {
    const qty = L.num(ln.qty) ?? 0;
    const price = L.num(ln.unitPrice);
    const cost = L.num(ln.costUnit);
    const amount = price !== null ? price * qty : null;
    const costAmount = cost !== null ? cost * qty : null;
    const gp = amount !== null && costAmount !== null ? amount - costAmount : null;
    const rate = gp !== null && amount ? gp / amount : null;
    return { qty: qty, price: price, cost: cost, amount: amount, costAmount: costAmount, gp: gp, rate: rate };
  };

  L.salesTotals = function (lines) {
    let supply = 0, cost = 0, missingCost = 0, missingPrice = 0;
    (lines || []).forEach((ln) => {
      const c = L.lineCalc(ln);
      if (c.amount === null) missingPrice++; else supply += c.amount;
      if (c.costAmount === null) missingCost++; else cost += c.costAmount;
    });
    const vat = L.vat(supply);
    const gp = supply - cost;
    return { supply: supply, vat: vat, total: supply + vat, cost: cost, gp: gp, rate: supply ? gp / supply : null, missingCost: missingCost, missingPrice: missingPrice };
  };

  /* ---------- 원가분석표 ---------- */
  L.costRows = function (lines) {
    return (lines || []).map((ln, i) => {
      const c = L.lineCalc(ln);
      return {
        no: i + 1,
        category: ln.category || '',
        name: ln.name || '',
        qty: c.qty,
        price: c.price,
        amount: c.amount,
        vendor: ln.vendorName || '',
        costItem: ln.costLabel || '',
        cost: c.cost,
        costAmount: c.costAmount,
        gp: c.gp,
        rate: c.rate
      };
    });
  };
  L.vendorSummary = function (rows) {
    const map = new Map();
    rows.forEach((r) => {
      const k = r.vendor || '(매입처 미지정)';
      if (!map.has(k)) map.set(k, { vendor: k, count: 0, costAmount: 0, sales: 0 });
      const v = map.get(k);
      v.count++;
      v.costAmount += r.costAmount || 0;
      v.sales += r.amount || 0;
    });
    return Array.from(map.values()).map((v) => Object.assign(v, { vat: L.vat(v.costAmount), total: v.costAmount + L.vat(v.costAmount) }));
  };

  /* ---------- 진행 단계 ---------- */
  L.stageOf = function (p) {
    if (p.status === 'won') return { key: 'won', label: '수주' };
    if (p.status === 'lost') return { key: 'lost', label: '실주' };
    if (p.status === 'submitted') return { key: 'submitted', label: '제출 완료' };
    const lines = (p.sales && p.sales.lines) || [];
    if (lines.length) return { key: 'sales', label: '견적 작성' };
    if ((p.quotes || []).length) return { key: 'review', label: '매입 검토' };
    if (((p.rfq && p.rfq.sent) || []).length) return { key: 'rfq', label: '회신 대기' };
    if ((p.items || []).length) return { key: 'items', label: '요청 정리' };
    return { key: 'new', label: '요청 입력' };
  };

  /* ---------- 문자열 ---------- */
  L.esc = (s) => String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  L.fill = (tpl, vars) => String(tpl || '').replace(/\{([^{}]+)\}/g, (m, k) => (Object.prototype.hasOwnProperty.call(vars, k) ? vars[k] : m));
  L.normName = (s) => String(s || '').replace(/\(주\)|㈜|주식회사|\s|[()]/g, '').toLowerCase();

  /* ---------- 매입처 견적 요청 메일 ---------- */
  L.rfqItems = function (project, itemIds) {
    const ids = itemIds && itemIds.length ? new Set(itemIds) : null;
    return (project.items || []).filter((it) => !ids || ids.has(it.id));
  };

  L.rfqEmail = function (project, vendor, settings, rep, opts) {
    opts = opts || {};
    const items = L.rfqItems(project, opts.itemIds);
    const company = (settings.company && settings.company.short) || '유니포인트';
    const mail = settings.mail || {};
    const repLabel = [rep && rep.name, rep && rep.title].filter(Boolean).join(' ');
    const vars = {
      '매입처': vendor.name || '',
      '담당자': vendor.contact || '담당자',
      '건명': project.title || '',
      '요청번호': project.no || '',
      '회신기한': L.fmtDateK(opts.replyBy),
      '보내는사람': repLabel,
      '회사': company,
      '고객사': opts.showCustomer ? ((project.customer && project.customer.company) || '') : ''
    };
    const subject = L.fill(mail.subject || '[{회사}] 견적 요청 - {건명}', vars).replace(/\s+/g, ' ').trim();
    const greet = L.fill(mail.greeting || '{매입처} {담당자}님, 안녕하세요.\n{회사} {보내는사람}입니다.\n\n아래 품목에 대한 견적을 요청드립니다.', vars);
    const reqs = L.fill(mail.requests || '부가세 별도 단가로 회신 부탁드립니다.\n견적 유효기간, 납기, 무상 유지보수 조건을 함께 적어 주세요.\n요청 사양과 다른 모델·수량으로 제안하시는 경우 변경 사유를 함께 적어 주세요.', vars);
    const closing = L.fill(mail.closing || '감사합니다.', vars);
    const c = project.conditions || {};
    const info = [
      ['건명', project.title + (opts.showCustomer && vars['고객사'] ? ' (' + vars['고객사'] + ')' : '')],
      ['요청번호', project.no],
      ['회신 요청일', vars['회신기한']],
      ['납품 희망일', c.dueDate],
      ['납품 장소', c.deliveryPlace],
      ['설치·구성', c.install],
      ['기타 조건', c.other]
    ].filter((r) => r[1]);
    const extra = (opts.extra || '').trim();
    const reqLines = reqs.split('\n').map((s) => s.trim()).filter(Boolean).concat(extra ? extra.split('\n').map((s) => s.trim()).filter(Boolean) : []);
    const sig = [
      repLabel ? (settings.company && settings.company.name ? settings.company.name + ' ' : '') + repLabel : (settings.company && settings.company.name) || '',
      rep && rep.tel ? 'TEL ' + rep.tel : '',

    };
    const sortRows = (rows, opts) => {
      const out = rows.slice();
      if (opts && opts.orderBy) {
        const f = opts.orderBy, dir = opts.dir === 'desc' ? -1 : 1;
        out.sort((a, b) => ((a[f] ?? '') > (b[f] ?? '') ? dir : (a[f] ?? '') < (b[f] ?? '') ? -dir : 0));
      }
      return opts && opts.limit ? out.slice(0, opts.limit) : out;
    };
    const fetchDoc = async (path) => {
      try {
        const j = await call('GET', '/api/docs?path=' + encodeURIComponent(path));
        const s = JSON.stringify(j.data);
        if (cache.get(path) === s) return;
        cache.set(path, s);
        (docW.get(path) || new Set()).forEach((w) => w.cb(clone(j.data)));
      } catch (e) { (docW.get(path) || new Set()).forEach((w) => { if (w.onErr && !w.loaded) w.onErr(e); }); }
      (docW.get(path) || new Set()).forEach((w) => { w.loaded = true; });
    };
    const colTimers = {};
    const scheduleCol = (c) => {
      clearTimeout(colTimers[c]);
      colTimers[c] = setTimeout(() => (colW.get(c) || new Set()).forEach((w) => fetchCol(c, w)), 1500);
    };
    const refreshAll = () => {
      colW.forEach((set, name) => set.forEach((w) => fetchCol(name, w)));
      docW.forEach((set, path) => { if (set.size) fetchDoc(path); });
    };
    setInterval(() => { if (document.visibilityState === 'visible') refreshAll(); }, 20000);
    window.addEventListener('focus', refreshAll);
    return {
      mode: 'api',
      watchCol(name, opts, cb, onErr) {
        const w = { cb: cb, opts: opts, onErr: onErr, loaded: false };
        if (!colW.has(name)) colW.set(name, new Set());
        colW.get(name).add(w);
        fetchCol(name, w);
        return () => colW.get(name).delete(w);
      },
      watchDoc(path, cb, onErr) {
        const w = { cb: cb, onErr: onErr, loaded: false };
        if (!docW.has(path)) docW.set(path, new Set());
        docW.get(path).add(w);
        cache.delete(path);
        fetchDoc(path);
        return () => docW.get(path).delete(w);
      },
      async set(path, data) {
        await call('PUT', '/api/docs', { path: path, data: data });
        cache.set(path, JSON.stringify(data));
        scheduleCol(colOf(path));
      },
      async del(path) {
        await call('DELETE', '/api/docs?path=' + encodeURIComponent(path));
        cache.delete(path);
        (docW.get(path) || new Set()).forEach((w) => w.cb(null));
        const c = colOf(path);
        (colW.get(c) || new Set()).forEach((w) => fetchCol(c, w));
      }
    };
  }

  function dbImpl(db) {
    return {
      mode: 'db',
      watchCol(name, opts, cb, onErr) {
        let q = db.collection(name);
        if (opts && opts.orderBy) q = q.orderBy(opts.orderBy, opts.dir || 'asc');
        if (opts && opts.limit) q = q.limit(opts.limit);
        return q.onSnapshot((snap) => cb(snap.docs.map((d) => Object.assign({}, clone(d.data()), { id: d.id }))), (e) => onErr && onErr(e));
      },
      watchDoc(path, cb, onErr) {
        return db.doc(path).onSnapshot((s) => cb(s.exists ? clone(s.data()) : null), (e) => onErr && onErr(e));
      },
      async set(path, data) {
        try { await db.doc(path).set(data); }
        catch (e) {
          if (e && e.code === 'unavailable') { await sleep(400 + Math.random() * 700); await db.doc(path).set(data); }
          else throw e;
        }
      },
      del(path) { return db.doc(path).delete(); }
    };
  }

  function localImpl() {
    const KEY = 'uq-quote-app:v1';
    const mem = new Map();
    try { const raw = localStorage.getItem(KEY); if (raw) Object.entries(JSON.parse(raw)).forEach(([k, v]) => mem.set(k, v)); } catch (e) { /* 없음 */ }
    const docW = new Map(), colW = new Map();
    const persist = debounce(() => { try { localStorage.setItem(KEY, JSON.stringify(Object.fromEntries(mem))); } catch (e) { /* 용량 초과 등 */ } }, 300);
    const colOf = (p) => p.split('/').slice(0, -1).join('/');
    const listCol = (name, opts) => {
      const out = [];
      mem.forEach((v, k) => { if (colOf(k) === name) out.push(Object.assign({}, clone(v), { id: k.split('/').pop() })); });
      if (opts && opts.orderBy) {
        const f = opts.orderBy, dir = opts.dir === 'desc' ? -1 : 1;
        out.sort((a, b) => ((a[f] ?? 0) > (b[f] ?? 0) ? dir : (a[f] ?? 0) < (b[f] ?? 0) ? -dir : 0));
      }
      return opts && opts.limit ? out.slice(0, opts.limit) : out;
    };
    const notify = (path) => {
      (docW.get(path) || new Set()).forEach((fn) => fn(mem.has(path) ? clone(mem.get(path)) : null));
      const c = colOf(path);
      (colW.get(c) || new Set()).forEach((w) => w.cb(listCol(c, w.opts)));
    };
    return {
      mode: 'local',
      watchCol(name, opts, cb) {
        const w = { cb: cb, opts: opts };
        if (!colW.has(name)) colW.set(name, new Set());
        colW.get(name).add(w);
        setTimeout(() => cb(listCol(name, opts)), 0);
        return () => colW.get(name).delete(w);
      },
      watchDoc(path, cb) {
        if (!docW.has(path)) docW.set(path, new Set());
        docW.get(path).add(cb);
        setTimeout(() => cb(mem.has(path) ? clone(mem.get(path)) : null), 0);
        return () => docW.get(path).delete(cb);
      },
      async set(path, data) { mem.set(path, clone(data)); persist(); setTimeout(() => notify(path), 0); },
      async del(path) { mem.delete(path); persist(); setTimeout(() => notify(path), 0); }
    };
  }

  async function pump(path, q) {
    q.running = true;
    while (q.next !== undefined) {
      const data = q.next; q.next = undefined;
      const waiters = q.waiters.splice(0);
      pending++; emit();
      let err = null;
      try { await impl.set(path, data); lastError = null; }
      catch (e) { err = e; lastError = e; console.warn('저장 실패', path, e); }
      pending--; emit();
      waiters.forEach((w) => (err ? w.reject(err) : w.resolve()));
    }
    q.running = false;
  }

  return {
    init(db) { impl = db === 'api' ? apiImpl() : db ? dbImpl(db) : localImpl(); emit(); },
    get mode() { return impl ? impl.mode : 'init'; },
    onStatus(fn) { subs.add(fn); fn({ pending: pending, error: lastError, mode: impl ? impl.mode : 'init' }); return () => subs.delete(fn); },
    watchCol(name, opts, cb, onErr) { return impl.watchCol(name, opts, cb, onErr); },
    watchDoc(path, cb, onErr) { return impl.watchDoc(path, cb, onErr); },
    set(path, data) {
      let q = queues.get(path);
      if (!q) { q = { running: false, next: undefined, waiters: [] }; queues.set(path, q); }
      q.next = data;
      const p = new Promise((resolve, reject) => q.waiters.push({ resolve: resolve, reject: reject }));
      if (!q.running) pump(path, q);
      return p;
    },
    async del(path) {
      pending++; emit();
      try { await impl.del(path); lastError = null; } catch (e) { lastError = e; throw e; } finally { pending--; emit(); }
    }
  };
})();

/* ---------- 파일 저장(다운로드) ---------- */
async function saveFile(filename, data) {
  if (RT.downloads) {
    try {
      await RT.downloads.save({ filename: filename, data: data });
      toast('저장했습니다 · ' + filename);
    } catch (e) {
      if (e && e.code === 'declined') return;
      if (e && e.code === 'rate_limited') { toast('저장 창이 이미 열려 있습니다. 잠시 후 다시 눌러 주세요.', 'bad'); return; }
      toast('파일을 저장하지 못했습니다' + (e && e.code ? ' (' + e.code + ')' : ''), 'bad');
    }
    return;
  }
  try {
    const blob = data instanceof Blob ? data : new Blob([data]);
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  } catch (e) {
    toast('이 화면에서는 파일을 내려받을 수 없습니다.', 'bad');
  }
}

/* ---------- 클립보드 ---------- */
async function copyText(text, label) {
  try { await navigator.clipboard.writeText(text); toast((label || '내용') + '을(를) 복사했습니다'); return true; }
  catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.cssText = 'position:fixed;left:-9999px;top:0';
    document.body.appendChild(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e2) { ok = false; }
    ta.remove();
    toast(ok ? (label || '내용') + '을(를) 복사했습니다' : '복사하지 못했습니다. 직접 선택해 복사해 주세요.', ok ? '' : 'bad');
    return ok;
  }
}
async function copyRich(htmlStr, text, label) {
  try {
    if (window.ClipboardItem && navigator.clipboard && navigator.clipboard.write) {
      await navigator.clipboard.write([new ClipboardItem({ 'text/html': new Blob([htmlStr], { type: 'text/html' }), 'text/plain': new Blob([text], { type: 'text/plain' }) })]);
      toast((label || '본문') + '을(를) 서식 그대로 복사했습니다');
      return true;
    }
  } catch (e) { /* 아래 방식으로 */ }
  try {
    const div = document.createElement('div');
    div.contentEditable = 'true';
    div.innerHTML = htmlStr;
    div.style.cssText = 'position:fixed;left:-9999px;top:0;background:#fff;color:#111';
    document.body.appendChild(div);
    const range = document.createRange(); range.selectNodeContents(div);
    const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
    const ok = document.execCommand('copy');
    sel.removeAllRanges(); div.remove();
    if (ok) { toast((label || '본문') + '을(를) 서식 그대로 복사했습니다'); return true; }
  } catch (e) { /* 텍스트로 */ }
  return copyText(text, label);
}

  const id = Math.random();
  _toastSet((list) => list.concat([{ id: id, msg: msg, kind: kind || '' }]).slice(-3));
  setTimeout(() => _toastSet((list) => list.filter((t) => t.id !== id)), kind === 'bad' ? 6000 : 3200);
}

}

function Modal({ title, onClose, children, footer }) {

}

/* ===== 첨부파일 읽기 (미리보기용) ===== */
const Files = {};

Files.MAX_TEXT = 120000;
Files.MAX_IMAGES = 6;

/* ---------- 파일 → 텍스트/이미지 ---------- */
function decodeQP(s) { return s.replace(/=\r?\n/g, '').replace(/=([0-9A-F]{2})/gi, (m, h) => String.fromCharCode(parseInt(h, 16))); }
function bytesFromBinStr(s) { const b = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) b[i] = s.charCodeAt(i) & 255; return b; }
function decodeCharset(bytes, cs) { try { return new TextDecoder(cs || 'utf-8').decode(bytes); } catch (e) { return new TextDecoder('utf-8').decode(bytes); } }
function emlToText(raw) {
  const parts = [];
  const walk = (chunk) => {
    const idx = chunk.search(/\r?\n\r?\n/);
    const head = idx >= 0 ? chunk.slice(0, idx) : chunk;
    const body = idx >= 0 ? chunk.slice(idx).replace(/^\r?\n\r?\n/, '') : '';
    const ct = (/content-type:\s*([^;\r\n]+)/i.exec(head) || [])[1] || 'text/plain';
    const bnd = (/boundary="?([^";\r\n]+)"?/i.exec(head) || [])[1];
    if (/multipart/i.test(ct) && bnd) {
      body.split('--' + bnd).slice(1).forEach((p) => { if (!/^--/.test(p)) walk(p.replace(/^\r?\n/, '')); });
      return;
    }
    if (!/text\/(plain|html)/i.test(ct)) return;
    const cte = ((/content-transfer-encoding:\s*([^\s;]+)/i.exec(head) || [])[1] || '').toLowerCase();
    const cs = (/charset="?([^";\s]+)"?/i.exec(head) || [])[1] || 'utf-8';
    let bytes;
    if (cte === 'base64') { try { bytes = bytesFromBinStr(atob(body.replace(/\s+/g, ''))); } catch (e) { bytes = bytesFromBinStr(body); } }
    else if (cte === 'quoted-printable') bytes = bytesFromBinStr(decodeQP(body));
    else bytes = bytesFromBinStr(body);
    let text = decodeCharset(bytes, cs);
    if (/html/i.test(ct)) text = htmlToText(text);
    parts.push({ html: /html/i.test(ct), text: text });
  };
  walk(raw);
  const plain = parts.find((p) => !p.html) || parts[0];
  const subj = (/^subject:\s*(.*)$/im.exec(raw) || [])[1] || '';
  const from = (/^from:\s*(.*)$/im.exec(raw) || [])[1] || '';
  return [subj ? '제목: ' + decodeMimeWords(subj) : '', from ? '보낸 사람: ' + decodeMimeWords(from) : '', plain ? plain.text : raw].filter(Boolean).join('\n');
}
function decodeMimeWords(s) {
  return s.replace(/=\?([^?]+)\?([BbQq])\?([^?]*)\?=/g, (m, cs, enc, t) => {
    try {
      const bytes = enc.toUpperCase() === 'B' ? bytesFromBinStr(atob(t)) : bytesFromBinStr(decodeQP(t.replace(/_/g, ' ')));
      return decodeCharset(bytes, cs);
    } catch (e) { return m; }
  });
}
function htmlToText(h0) {
  try {
    const doc = new DOMParser().parseFromString(h0, 'text/html');
    doc.querySelectorAll('script,style').forEach((n) => n.remove());
    doc.querySelectorAll('br').forEach((n) => n.replaceWith('\n'));
    doc.querySelectorAll('p,div,tr,li,h1,h2,h3,h4').forEach((n) => n.append('\n'));
    doc.querySelectorAll('td,th').forEach((n) => n.append(' | '));
    return (doc.body.textContent || '').replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
  } catch (e) { return h0.replace(/<[^>]+>/g, ' '); }
}

Files.extractFile = async function (file, opts) {
  const name = file.name || '파일';
  const ext = (name.split('.').pop() || '').toLowerCase();
  const maxImages = (opts && opts.maxImages) || Files.MAX_IMAGES;
  const out = { name: name, kind: 'text', text: '', images: [], note: '' };
  if (['xlsx', 'xlsm', 'xls', 'csv', 'ods'].includes(ext)) {
    await loadLib('xlsx');
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array', cellDates: true });
    // 미리보기 표: 시트별 행(빈 행 제외, 최대 300행 · 30열)
    out.sheets = wb.SheetNames.map((sn) => {
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header: 1, blankrows: false, raw: false, defval: '', dateNF: 'yyyy-mm-dd' })
        .map((r) => r.slice(0, 30).map((v) => String(v).trim()))
        .filter((r) => r.some(Boolean));
      const width = rows.reduce((m, r) => { let k = r.length; while (k && !r[k - 1]) k--; return Math.max(m, k); }, 0);
      let lead = width;
      rows.forEach((r) => { const k = r.findIndex(Boolean); if (k >= 0 && k < lead) lead = k; });
      return { name: sn, rows: rows.slice(0, 300).map((r) => r.slice(lead, width)) };
    });
    out.text = wb.SheetNames.map((sn) => {
      const csv = XLSX.utils.sheet_to_csv(wb.Sheets[sn], { blankrows: false, dateNF: 'yyyy-mm-dd' });
      const lines = csv.split('\n').map((l) => l.replace(/,+$/, '')).filter((l) => l.replace(/[,\s"]/g, ''));
      return '### 시트: ' + sn + '\n' + lines.join('\n');
    }).join('\n\n');
    out.note = '엑셀 ' + wb.SheetNames.length + '개 시트';
    return out;
  }
  if (ext === 'pdf') {
    await loadLib('pdf');
    const data = new Uint8Array(await file.arrayBuffer());
    const pdf = await pdfjsLib.getDocument({ data: data, isEvalSupported: false }).promise;
    const n = Math.min(pdf.numPages, 30);
    const pages = [];
    for (let i = 1; i <= n; i++) {
      const page = await pdf.getPage(i);
      const tc = await page.getTextContent();
      let s = '';
      tc.items.forEach((it) => { s += it.str + (it.hasEOL ? '\n' : ' '); });
      pages.push(s.replace(/[ \t]+/g, ' ').trim());
    }
    const textLen = pages.join('').replace(/\s/g, '').length;
    if (textLen >= 40 * n || !maxImages) {
      out.text = pages.map((p, i) => '--- ' + (i + 1) + '쪽 ---\n' + p).join('\n');
      out.note = 'PDF ' + pdf.numPages + '쪽' + (textLen < 40 * n ? ' (글자가 거의 없음 — 스캔본일 수 있음)' : '');
    } else {
      out.kind = 'images';
      for (let i = 1; i <= Math.min(n, maxImages); i++) {
        const page = await pdf.getPage(i);
        const vp = page.getViewport({ scale: 1.7 });
        const cv = document.createElement('canvas');
        cv.width = Math.round(vp.width); cv.height = Math.round(vp.height);
        await page.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
        const blob = await new Promise((r) => cv.toBlob(r, 'image/png'));
        if (blob) out.images.push(blob);
      }
      out.note = '스캔 PDF · 이미지 ' + out.images.length + '장으로 읽음';
    }
    return out;
  }
  if (ext === 'docx') {
    await loadLib('mammoth');
    const r = await mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() });
    out.text = r.value || '';
    out.note = '워드 문서';
    return out;
  }
  if (['png', 'jpg', 'jpeg', 'webp', 'gif'].includes(ext) || /^image\//.test(file.type || '')) {
    out.kind = 'images';
    out.images = [file];
    out.note = '이미지';
    return out;
  }
  if (ext === 'eml') { out.text = emlToText(await file.text()); out.note = '메일 파일'; return out; }
  if (['html', 'htm'].includes(ext)) { out.text = htmlToText(await file.text()); out.note = 'HTML'; return out; }
  if (['txt', 'md', 'json', 'tsv', 'log'].includes(ext) || /^text\//.test(file.type || '')) { out.text = await file.text(); out.note = '텍스트'; return out; }
  if (ext === 'msg') { out.kind = 'unsupported'; out.note = 'Outlook .msg 파일은 읽을 수 없습니다. 메일 본문을 복사해 붙여넣거나 [다른 이름으로 저장 → .eml/PDF]로 올려 주세요.'; return out; }
  if (['hwp', 'hwpx'].includes(ext)) { out.kind = 'unsupported'; out.note = '한글(HWP) 파일은 PDF로 저장해 올려 주세요.'; return out; }
  out.kind = 'unsupported';
  out.note = '이 형식(.' + ext + ')은 읽을 수 없습니다.';
  return out;
};

/* 붙여넣은 원문 + 읽은 첨부 텍스트를 한 덩어리로 (매입 견적 원본 보관용) */
Files.collectText = function (raw, files) {
  const texts = [];
  if (str(raw)) texts.push('[붙여넣은 내용]\n' + str(raw));
  (files || []).forEach((f) => { if (f.status === 'ready' && f.text) texts.push('[첨부: ' + f.name + ']\n' + f.text); });
  let text = texts.join('\n\n');
  if (text.length > Files.MAX_TEXT) text = text.slice(0, Files.MAX_TEXT) + '\n…(이하 생략)';
  return text;
};

function mergeSettings(doc) {
  const d = doc || {};
  const s = clone(DEFAULT_SETTINGS);
  s.company = Object.assign(s.company, d.company || {});
  if (Array.isArray(d.reps) && d.reps.length) s.reps = d.reps;
  s.defaults = Object.assign(s.defaults, d.defaults || {});
  if (!Array.isArray(s.defaults.conditions)) s.defaults.conditions = [];
  s.mail = Object.assign(s.mail, d.mail || {});
  s.logo = d.logo || null;
  s._saved = !!doc;
  return s;
}

function repOf(settings, id) {
  return (settings.reps || []).find((r) => r.id === id) || (settings.reps || [])[0] || { name: '', title: '' };
}
function repLabel(rep) { return [rep && rep.name, rep && rep.title].filter(Boolean).join(' '); }
function contactLine(rep) {
  if (!rep) return '';
  const parts = [];
  const head = repLabel(rep);
  if (rep.tel) parts.push((head ? head + ' ' : '') + 'TEL: ' + rep.tel); else if (head) parts.push(head);
  if (rep.fax) parts.push('FAX: ' + rep.fax);
  let line = parts.join(' / ');
  if (rep.mobile) line += ' /  Mobile : ' + rep.mobile;
  if (rep.email) line += '  e-mail : ' + rep.email;
  return line;
}
function logoB64(settings) {
  const src = (settings && settings.logo) || LOGO_DATA;
  return src.replace(/^data:image\/\w+;base64,/, '');
}

/* 견적서(매출) 데이터 */

  const rep = repOf(settings, p.repId);

    lines: (s.lines || []).map((ln) => ({ category: ln.category, name: ln.name, specs: ln.specs || [], qty: ln.qty, unitPrice: ln.unitPrice, note: ln.note })),
    notes: (s.notes || []).filter((n) => n.title || n.reason),

}

  blank('r4');

    <td colspan="4" class=${'co fr' + (x[3] ? ' big' : '')} style="white-space:pre">${x[2] || ''}</td></tr>`));
  blank('r9');
  rows.push(html`<tr key="r10"><td class="lbl fl" colspan="8">아래와 같이 견적합니다.</td><td class="fr"></td></tr>`);
  rows.push(html`<tr key="r11"><td class="fl" colspan="6"></td><td class="unit fr" colspan="3">[단위 : 원, VAT별도]</td></tr>`);
  rows.push(html`<tr key="hd" class="hd">${['NO', '품목', '품명', '상세내역', '스펙', '수량', '제안 단가', '제안가 합계', '비고'].map((t, i) => html`<td key=${t} class=${i === 0 ? fl : i === 8 ? fr : ''}>${t}</td>`)}</tr>`);
  (d.lines || []).forEach((ln, idx) => {

    for (let k = 0; k < span; k++) {
      const cls = 'it' + (k === 0 ? ' first' : '') + (k === span - 1 ? ' last' : '');
      const s = k > 0 ? specs[k - 1] : null;
      rows.push(html`<tr key=${'l' + idx + '-' + k} class=${cls}>
        ${k === 0 ? html`<td rowspan=${span} class="c m fl">${idx + 1}</td>` : null}
        ${k === 0 ? html`<td rowspan=${span} class="c m wrap">${ln.category || ''}</td>` : null}
        <td class="c ar" style=${k === 0 && (ln.name || '').length > 20 ? 'font-size:' + (14.7 * 20 / ln.name.length).toFixed(1) + 'px' : ''}>${k === 0 ? (ln.name || '') : (s.cat || '')}</td>
        <td style=${k > 0 && (s.detail || '').length > 30 ? 'font-size:' + (14.7 * 30 / s.detail.length).toFixed(1) + 'px' : ''}>${k === 0 ? '' : (s.detail || '')}</td>
        <td class="c">${k === 0 ? '' : (s.spec || '')}</td>
        ${k === 0 ? html`<td rowspan=${span} class="c m">${L.num(ln.qty) ?? ''}</td>` : null}
        ${k === 0 ? html`<td rowspan=${span} class="m amt">${L.num(ln.unitPrice) === null ? '' : L.fmt(ln.unitPrice)}</td>` : null}
        ${k === 0 ? html`<td rowspan=${span} class="m amt">${L.fmt(amt)}</td>` : null}
        ${k === 0 ? html`<td rowspan=${span} class="c m wrap fr">${ln.note || ''}</td>` : null}
      </tr>`);
    }

  rows.push(html`<tr key="s1" class="sum"><td class="fl" colspan="7" style="text-align:center">합계 (VAT 별도)</td><td class="v">${L.fmt(total)}</td><td class="fr"></td></tr>`);

  const notes = (d.notes || []).filter((n) => n.title || n.reason);

}

/* 컨테이너 폭에 맞춰 축소 표시 */
function ScaledDoc({ children, width }) {
  const outer = useRef(null), inner = useRef(null);
  const [st, setSt] = useState({ s: 0.5, h: 400 });
  useLayoutEffect(() => {
    const fit = () => {
      if (!outer.current || !inner.current) return;
      const w = outer.current.clientWidth;
      const s = Math.min(1, w / (width || 1256));
      setSt({ s: s, h: inner.current.offsetHeight * s });
    };
    fit();
    const ro = new ResizeObserver(fit);
    ro.observe(outer.current);
    ro.observe(inner.current);
    return () => ro.disconnect();
  }, []);
  return html`<div ref=${outer} style=${'width:100%;height:' + Math.ceil(st.h) + 'px;overflow:hidden'}><div ref=${inner} class="docscale" style=${'width:' + (width || 1256) + 'px;transform:scale(' + st.s + ')'}>${children}</div></div>`;
}

async function exportSalesPdf(p, settings) {
  await Promise.all([loadLib('html2canvas'), loadLib('jspdf')]);
  const host = document.createElement('div');
  host.style.cssText = 'position:fixed;left:-20000px;top:0;width:1256px;background:#fff;z-index:-1';
  document.body.appendChild(host);
  try {
    render(html`<${QuoteDoc} data=${salesDocData(p, settings)} />`, host);
    try { await document.fonts.ready; } catch (e) { /* 무시 */ }
    await sleep(60);
    const el = host.querySelector('.qdoc');
    const canvas = await html2canvas(el, { scale: 2, backgroundColor: '#ffffff', logging: false });
    const pdf = new jspdf.jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4', compress: true });
    const margin = 8, pageW = 210, pageH = 297;
    const imgW = pageW - margin * 2;
    const pxPerMm = canvas.width / imgW;
    const pageHpx = Math.floor((pageH - margin * 2) * pxPerMm);
    let y = 0, page = 0;
    while (y < canvas.height - 2) {
      const hpx = Math.min(pageHpx, canvas.height - y);
      const c = document.createElement('canvas');
      c.width = canvas.width; c.height = hpx;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(canvas, 0, y, canvas.width, hpx, 0, 0, canvas.width, hpx);
      if (page) pdf.addPage();
      pdf.addImage(c.toDataURL('image/jpeg', 0.93), 'JPEG', margin, margin, imgW, hpx / pxPerMm);
      y += hpx; page++;
    }
    const blob = pdf.output('blob');
    await saveFile('견적서_' + fileBase(p) + '_' + (p.no || '') + '.pdf', blob);
  } finally {
    render(null, host);
    host.remove();
  }
}

async function exportRfqEml(p, targets, settings, opts) {
  await Promise.all([loadLib('exceljs'), loadLib('jszip')]);
  const zip = new JSZip();
  let i = 0;
  for (const t of targets) {
    i++;
    const r = await rfqXlsxBuffer(p, t.vendor, settings, Object.assign({}, opts, { itemIds: t.itemIds }));
    const eml = L.buildEml({ to: r.mail.to, cc: r.mail.cc, subject: r.mail.subject, text: r.mail.text, html: r.mail.html, attachments: [{ filename: rfqFileName(p, t.vendor), mime: XLSX_MIME, bytes: new Uint8Array(r.buf) }] });
    const ascii = String(t.vendor.name || '').replace(/[^A-Za-z0-9]+/g, '').slice(0, 20);
    zip.file('RFQ_' + (p.no || 'quote') + '_' + String(i).padStart(2, '0') + (ascii ? '_' + ascii : '') + '.eml', eml);
  }
  const blob = await zip.generateAsync({ type: 'blob', compression: 'DEFLATE' });
  const one = targets.length === 1 ? '_' + L.safeName(targets[0].vendor.name || '') : '_' + targets.length + '곳';
  await saveFile('견적요청메일_' + (p.no || '') + one + '.zip', blob);
}

  { n: 5, key: 'sales', title: '매출 견적서', sub: '매입가 + GP' },
  { n: 6, key: 'cost', title: '원가분석표', sub: 'GP · GP%' }
];

function stepDone(p, n) {
  if (n === 1) return !!(str(p.request && p.request.raw) || (p.request && p.request.files && p.request.files.length) || (p.items || []).length);
  if (n === 2) return (p.items || []).length > 0;
  if (n === 3) return ((p.rfq && p.rfq.sent) || []).length > 0;
  if (n === 4) return (p.quotes || []).length > 0;
  if (n === 5) return ((p.sales && p.sales.lines) || []).length > 0;
  if (n === 6) return p.status === 'submitted' || p.status === 'won' || p.status === 'lost';
  return false;
}
function suggestStep(p) {
  if (((p.sales && p.sales.lines) || []).length) return 5;
  if ((p.quotes || []).length) return 4;
  if (((p.rfq && p.rfq.sent) || []).length || ((p.rfq && p.rfq.targets) || []).length) return 4;
  if ((p.items || []).length) return 3;
  return 1;
}

function StepNav({ prev, next, nextLabel, onPrev, onNext, extra, nextDisabled }) {

function fileInfo(f) {
  if (f.status === 'reading') return '읽는 중';

}

function FilePreview({ file, onClose }) {
  const [urls, setUrls] = useState([]);
  useEffect(() => {
    const u = ((file && file.images) || []).map((b) => URL.createObjectURL(b));
    setUrls(u);
    return () => u.forEach((x) => URL.revokeObjectURL(x));
  }, [file]);
  if (!file) return null;
  return html`<div class="fpreview">
    <div class="fpreview-h"><${Icon} name="file" size=${14} /><b class="small" style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${file.name}</b>
      <span class="xs faint">${file.note || ''}</span>
      ${file.text ? html`<button class="btn ghost sm" onClick=${() => copyText(file.text, '파일 내용')}><${Icon} name="copy" size=${13} />복사</button>` : null}
      <button class="btn ghost icon sm" aria-label="미리보기 닫기" onClick=${onClose}><${Icon} name="x" size=${14} /></button></div>
    <div class="fpreview-b">
      ${urls.map((u, i) => html`<img key=${i} src=${u} alt=${file.name + ' ' + (i + 1)} />`)}
      ${file.sheets && file.sheets.length ? html`<${SheetTables} sheets=${file.sheets} />` : file.text ? html`<pre>${file.text}</pre>` : null}
      ${!urls.length && !file.text ? html`<span class="small faint">보여줄 내용이 없습니다.</span>` : null}
    </div>
  </div>`;
}

function useFileReader() {
  const [files, setFiles] = useState([]);
  const add = async (list, onReady) => {
    for (const f of list) {
      const id = L.uid('f');
      setFiles((fs) => fs.concat([{ id: id, name: f.name || '붙여넣은 이미지', status: 'reading' }]));
      try {
        const r = await Files.extractFile(f);
        const status = r.kind === 'unsupported' ? 'error' : 'ready';
        const done = Object.assign({ id: id }, r, { status: status });
        if (status === 'ready' && onReady && onReady(done)) setFiles((fs) => fs.filter((x) => x.id !== id));
        else setFiles((fs) => fs.map((x) => (x.id === id ? done : x)));
      } catch (e) {
        setFiles((fs) => fs.map((x) => (x.id === id ? Object.assign({}, x, { status: 'error', note: '읽지 못했습니다' }) : x)));
        console.warn(e);
      }
    }
  };
  const remove = (f) => setFiles((fs) => fs.filter((x) => x !== f && x.id !== f.id));
  return { files: files, add: add, remove: remove, clear: () => setFiles([]) };
}
